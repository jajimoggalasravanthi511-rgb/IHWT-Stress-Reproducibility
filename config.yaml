experiment:
  name: ihwt_stress_subject_independent
  seeds: [11, 23, 37, 53, 71]
  output_dir: outputs

data:
  manifest: data_manifest.csv
  subject_column: subject_id
  label_column: label
  condition_column: condition
  modalities: [ecg, gsr, ppg]
  window_seconds: 30.0
  overlap: 0.50
  min_valid_fraction: 0.95
  deep_input_samples: 2048

preprocessing:
  ecg:
    bandpass_hz: [0.5, 40.0]
    filter_order: 5
  gsr:
    lowpass_hz: 5.0
    filter_order: 4
  ppg:
    bandpass_hz: [0.5, 8.0]
    filter_order: 4
  powerline_hz: 50.0
  notch_q: 30.0
  spike_z: 3.0
  within_window_zscore: true

ihwt:
  wavelet: db4
  max_level: 4
  entropy_threshold: 0.55
  interpolation_lambda: 0.65
  min_node_samples: 64
  eps: 1.0e-12

feature_methods: [ihwt, dwt, wpt, fft]

models:
  random_forest:
    n_estimators: 500
    max_depth: null
    min_samples_leaf: 2
    max_features: sqrt
    class_weight: balanced_subsample
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 1.0
    reg_alpha: 0.05
  rusboost:
    n_estimators: 300
    learning_rate: 0.05
    weak_learner_depth: 3
  ensemble:
    inner_group_folds: 5
    weight_metric: accuracy
    min_weight: 0.05

evaluation:
  protocol: LOSO
  bootstrap_iterations: 5000
  confidence_level: 0.95
  primary_metric: f1_macro
  statistical_metric: f1_macro
  holm_correction: true

runtime:
  repeats: 30
  signal_lengths: [1024, 2048, 4096, 8192]

deep_baselines:
  enabled: false
  models: [cnn, bilstm, transformer]
  epochs: 40
  batch_size: 64
  learning_rate: 0.001
  patience: 6
  hidden_dim: 96
  dropout: 0.25
